name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q
      - run: python -m quantlab --config examples/demo_config.json research
      - run: python -m quantlab --config examples/demo_config.json agent-compare --agent-mode mock

  qlib-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev,ml,qlib]'
      - run: python -m pytest -q tests/test_qlib_bridge.py tests/test_naver_data.py
      - name: Train and evaluate actual Qlib LGBModel on synthetic test candles
        run: python -m quantlab --config examples/demo_config.json qlib-compare --symbol SYNTHETIC-ONLY
