name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev,ws]'
      - run: python -m pytest -q
      - run: python -m quantlab --config examples/demo_config.json research
      - run: python -m quantlab --config examples/demo_config.json agent-compare --agent-mode mock

  qlib-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev,ml,qlib,ws]'
      - name: Match pinned frozen Qlib candidate runtime for exact golden validation
        run: python -m pip install lightgbm==4.7.0 numpy==2.5.4
      - run: python -m pytest -q tests/test_qlib_bridge.py tests/test_naver_data.py tests/test_qlib_frozen.py tests/test_qlib_lab.py tests/test_qlib_artifacts.py tests/test_lane_comparison.py tests/test_isolated_automation.py tests/test_daily_receipt.py tests/test_historical_stress.py tests/test_qlib_historical_stress.py tests/test_qlib_failure_diagnostics.py tests/test_qlib_horizon_study.py tests/test_qlib_feature_ablation.py tests/test_qlib_cross_market.py tests/test_continuous_portfolio.py tests/test_liquidity_issuer_evidence.py tests/test_fill_aware_portfolio.py tests/test_live_orderbook_evidence.py tests/test_live_trade_evidence.py tests/test_microstructure_observer.py tests/test_microstructure_24h_gate.py tests/test_microstructure_24h_systemd.py tests/test_websocket_microstructure.py tests/test_websocket_quality.py
      - name: Train and evaluate actual Qlib LGBModel on synthetic test candles
        run: python -m quantlab --config examples/demo_config.json qlib-compare --symbol SYNTHETIC-ONLY
