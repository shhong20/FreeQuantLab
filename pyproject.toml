[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "freequantlab"
version = "0.2.0"
description = "Local, cost-conscious quantitative research and forward paper trading for crypto and stocks"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "pandas>=2.0,<3", "scikit-learn>=1.4,<2", "requests>=2.31,<3", "exchange-calendars>=4.5,<5"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
ml = ["lightgbm>=4,<5"]

[project.scripts]
freequant = "quantlab.cli:main"

[tool.setuptools.packages.find]
include = ["quantlab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
